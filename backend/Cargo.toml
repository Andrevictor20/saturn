[package]
name = "backend"
version = "4.1.1"
edition = "2021"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22"
bollard = "0.21.1"
dotenvy = "0.15.7"
futures = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
once_cell = "1.21.4"
portable-pty = "0.9.0"
thiserror = "2.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
mimalloc = { version = "0.1.52", default-features = false }
subtle = "2.6.1"
sysinfo = "0.39.6"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["set-header", "cors", "fs", "compression-full"] }
uuid = { version = "1.24.1", features = ["v4"] }
zip = "8.6.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"
regex = "1.13.1"
tokio-util = { version = "0.7", features = ["io"] }
libc = "0.2"
tokio-stream = { version = "0.1.19", features = ["sync"] }
totp-rs = { version = "6.0.0", features = ["gen_secret", "qr", "serde"] }

[dev-dependencies]
axum-test = "21.0.0"
http-body-util = "0.1.5"
tower = "0.5.3"

[profile.dev]
opt-level = 0
# debug = 1 provides file/line backtraces while cutting linker memory usage drastically
debug = 1
incremental = true

[profile.test]
opt-level = 0
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'LICENSE'
      - '.gitignore'
      - 'install.sh'
      - 'scripts/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'LICENSE'
      - '.gitignore'
      - 'install.sh'
      - 'scripts/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-backend:
    name: Backend Tests & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run SAST (Cargo Audit)
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-audit
          cd backend && cargo audit --ignore RUSTSEC-2023-0071


      - name: Run Backend Tests
        run: cd backend && cargo test

      - name: Setup Node (for wait-on)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Smoke Load Test
        run: |
          cd backend
          cargo run &
          npx --yes wait-on tcp:5172
          k6 run load-tests/smoke_test.js

  test-frontend:
    name: Frontend Tests, E2E & Visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Run Unit Tests
        run: cd frontend && npm run test

      - name: Typecheck & Build Frontend
        run: cd frontend && npm run build

      - name: Run SAST (npm audit)
        run: cd frontend && npm audit --audit-level=high

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers & OS Deps
        run: cd frontend && npx playwright install --with-deps

      - name: Setup Rust for Backend API
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run E2E & Visual Tests
        run: |
          cd backend && cargo run &
          npx --yes wait-on tcp:5172
          cd frontend
          npm run test:e2e
          npm run test:visual:ci

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7


  test-security-dast:
    name: Security DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node for wait-on
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Start Backend API
        run: |
          cd backend && cargo run &
          npx --yes wait-on tcp:5172

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:5172'
          format: openapi
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          issue_title: 'ZAP Security Report'
          artifact_name: 'zapresults'
          fail_action: false

